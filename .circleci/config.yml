version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

aliases:
  # -------------------------
  #      ALIASES: Caches
  # -------------------------
  - &restore-deps-cache
    key: bun-v1-{{ arch }}-{{ checksum "bun.lock" }}-{{ checksum ".bun-version" }}

  - &save-deps-cache
    key: bun-v1-{{ arch }}-{{ checksum "bun.lock" }}-{{ checksum ".bun-version" }}
    paths:
      - ~/test-coverage/node_modules

  - &install-bun
    name: Install Bun
    command: |
      curl -fsSL https://bun.com/install | bash -s "bun-v$(cat .bun-version)"
      echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"

  # -------------------------
  #  ALIASES: Branch Filters
  # -------------------------
  - &filter-only-master
    branches:
      only: master
  - &filter-only-semantic-pr
    branches:
      only:  /^(pull|dependabot|fix|feat)\/.*$/
  - &filter-only-fork-pr
    branches:
      only:  /^pull\/.*$/

defaults: &defaults
  working_directory: ~/test-coverage
  docker:
    - image: cimg/node:24.10.0

jobs:
  test:
    <<: *defaults
    steps:
      - checkout
      - run: *install-bun
      - restore_cache: *restore-deps-cache
      - run: bun install --frozen-lockfile
      - run: bun run test
      - codecov/upload:
          version: v11.3.1
          files: coverage/lcov.info
          disable_search: true
          fail_on_error: true
      - save_cache: *save-deps-cache

  build:
    <<: *defaults
    steps:
      - checkout
      - run: *install-bun
      - restore_cache: *restore-deps-cache
      - run: bun install --frozen-lockfile
      - run: bun run build
      - save_cache: *save-deps-cache

  release:
    <<: *defaults
    steps:
      - checkout
      - run: *install-bun
      - restore_cache: *restore-deps-cache
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run release
      - save_cache: *save-deps-cache

workflows:
  version: 2
  analysis:
    jobs:
      - test:
          filters: *filter-only-semantic-pr
      - build:
          filters: *filter-only-semantic-pr
          requires:
            - test

  release:
    jobs:
      - test:
          filters: *filter-only-master
      - build:
          filters: *filter-only-master
      - hold:
          filters: *filter-only-master
          type: approval
          requires:
            - test
            - build
      - release:
          filters: *filter-only-master
          context: open-rpc-deployer
          requires:
            - hold
